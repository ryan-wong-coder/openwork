<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="zeno-canvas-shell" content="1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; frame-src about:; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <style>html,body{margin:0;width:100%;overflow:hidden}iframe{display:block;width:100%;height:360px;border:0}</style>
</head>
<body>
<script>
// This trusted file is served with Connection-Allowlist: (). The application
// verifies browser support and delivery before it sends any generated content.
// Local-scheme descendants inherit that native policy, including for WebRTC.
(()=>{
  const channel='zeno-conversation-canvas';
  const token=new URLSearchParams(location.search).get('instance');
  if(!token||!/^[a-f0-9]{48}$/.test(token)||parent===window)return;
  let frame=null,last=360,queued=null,scheduled=false;
  const forward=()=>{scheduled=false;if(queued){parent.postMessage(queued,'*');queued=null}};
  window.addEventListener('message',event=>{
    const data=event.data;
    if(!data||data.channel!==channel||data.token!==token)return;
    if(event.source===parent){
      if(data.type==='document'&&!frame&&typeof data.srcDoc==='string'&&data.srcDoc.length<=20_000_000){
        frame=document.createElement('iframe');
        frame.title='画板内容';frame.setAttribute('sandbox','allow-scripts');frame.setAttribute('referrerpolicy','no-referrer');
        frame.srcdoc=data.srcDoc;document.body.append(frame);
      }else if(data.type==='theme'&&frame)frame.contentWindow.postMessage(data,'*');
      return;
    }
    if(!frame||event.source!==frame.contentWindow||event.origin!=='null')return;
    if(data.type==='height'&&typeof data.height==='number'&&Number.isFinite(data.height)&&data.height>0){
      const height=Math.min(960,Math.max(240,Math.ceil(data.height)));
      if(Math.abs(height-last)>=3){last=height;frame.style.height=height+'px';queued={channel,token,type:'height',height};if(!scheduled){scheduled=true;requestAnimationFrame(forward)}}
    }else if(data.type==='ready'||data.type==='error')parent.postMessage({channel,token,type:data.type},'*');
  });
  parent.postMessage({channel,token,type:'shell-ready'},'*');
})();
</script>
</body>
</html>
