<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zeno conversation canvas component verification</title>
    <style>
      html,body{margin:0;min-width:0;background:var(--background);color:var(--foreground);font:13px/1.5 system-ui,sans-serif}
      *{box-sizing:border-box}.fixture-shell{max-width:960px;margin:auto;padding:28px 24px 60px}.fixture-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:24px}.fixture-heading h1{margin:0;font-size:18px;font-weight:600}.fixture-meta{font-size:12px;color:var(--muted-foreground)}.fixture-answer{min-width:0;max-width:100%}
      @media(max-width:500px){.fixture-shell{padding:16px 12px 32px}.fixture-heading{align-items:flex-start;gap:8px}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
