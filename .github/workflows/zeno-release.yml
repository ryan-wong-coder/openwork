name: Release Zeno

# Deliberately independent of the upstream v* tag release, npm publication and
# organization environments. A Zeno tag works from the personal branch too.
on:
  push:
    tags: ["zeno-v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Zeno release tag (optional -build.N revision)
        required: true
        default: zeno-v1.0.0
        type: string
      publish_release:
        description: Publish the verified six-target GitHub release
        type: boolean
        default: true
      macos_signing:
        description: Persistent macOS signing identity
        type: choice
        options: [self-signed, developer-id]
        default: self-signed
      windows_signing:
        description: Windows Authenticode signing
        type: choice
        options: [unsigned, certificate]
        default: unsigned

permissions:
  contents: read

concurrency:
  group: zeno-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      macos_signing: ${{ steps.version.outputs.macos_signing }}
      windows_signing: ${{ steps.version.outputs.windows_signing }}
      publish_release: ${{ steps.version.outputs.publish_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate the explicit Zeno tag and version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          MACOS_SIGNING: ${{ inputs.macos_signing || 'self-signed' }}
          WINDOWS_SIGNING: ${{ inputs.windows_signing || 'unsigned' }}
          PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish_release }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const version = JSON.parse(readFileSync('apps/desktop/package.json', 'utf8')).version;
          const tag = process.env.RELEASE_TAG;
          const baseTag = `zeno-v${version}`;
          const revisionPrefix = `${baseTag}-build.`;
          const matchesVersion = tag === baseTag || (tag?.startsWith(revisionPrefix) && /^[1-9]\d*$/.test(tag.slice(revisionPrefix.length)));
          if (!/^\d+\.\d+\.\d+$/.test(version) || !matchesVersion) throw new Error('Use a committed zeno-vX.Y.Z[-build.N] tag matching the desktop version.');
          if (!['self-signed', 'developer-id'].includes(process.env.MACOS_SIGNING) || !['unsigned', 'certificate'].includes(process.env.WINDOWS_SIGNING)) throw new Error('Invalid signing mode.');
          for (const [key, value] of Object.entries({ version, release_tag: process.env.RELEASE_TAG, macos_signing: process.env.MACOS_SIGNING, windows_signing: process.env.WINDOWS_SIGNING, publish_release: process.env.PUBLISH_RELEASE })) appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          JS

  preflight:
    needs: validate
    name: Verify personal data and local execution
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.release_tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install shared contract, application and local task dependencies
        run: pnpm --filter @zeno/api... --filter @openwork/app... --filter @openwork/sdk... --filter @openwork/desktop... install --frozen-lockfile
      - name: Build the exact shared contracts and native thread adapters
        run: |
          pnpm --filter @openwork/types build
          pnpm --filter @zeno/core build
          pnpm --filter @openwork/remote-sessions build
          pnpm --filter @openwork/headless-threads build
      - name: Verify accounts, synchronization, calendar and fitness semantics
        run: |
          pnpm --filter @zeno/core contract:check
          pnpm --filter @zeno/core typecheck
          pnpm --filter @zeno/core test
          pnpm --filter @openwork/features exec bun test src
          pnpm --filter @zeno/fitness typecheck
          pnpm --filter @zeno/fitness test
          pnpm --filter @zeno/api typecheck
          pnpm --filter @zeno/api test
          pnpm --filter @zeno/api build
          python3 infra/zeno-release/zeno-api/backup.test.py
      - name: Verify local execution recovery and desktop account boundaries
        run: timeout --kill-after=5s 90s node --test --test-reporter=spec apps/desktop/test/zeno-personal.test.mjs apps/desktop/test/zeno-personal-tools.test.mjs apps/desktop/test/zeno-scheduler.test.mjs apps/desktop/test/session-runner.test.mjs apps/desktop/test/zeno-update-portable-smoke.test.mjs apps/desktop/test/zeno-license-packaging.test.mjs
      - name: Build the desktop UI and independent mobile application
        run: |
          pnpm --filter @openwork/app typecheck
          pnpm --filter @openwork/app exec bun test tests/use-workspace-route-state.test.tsx
          pnpm --filter @openwork/app exec bun test tests/zeno-personal-data.test.ts tests/zeno-account-boundary.test.tsx tests/zeno-event-lifetime.test.ts tests/zeno-form-input.test.tsx
          pnpm --filter @openwork/app build:personal

  build:
    needs: [validate, preflight]
    name: Build ${{ matrix.platform }}/${{ matrix.arch }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: windows-2025
            platform: win32
            arch: x64
          - runner: windows-11-arm
            platform: win32
            arch: arm64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
      ZENO_MAC_SIGNING: ${{ needs.validate.outputs.macos_signing }}
      ZENO_WINDOWS_SIGNING: ${{ needs.validate.outputs.windows_signing }}
      # The combined desktop/fitness renderer exceeds Node 24's 2 GiB default
      # on the native 8 GiB Apple Silicon runner. This is a cap, not reservation.
      NODE_OPTIONS: --max-old-space-size=6144
      # Build and smoke-test every package with its matching native CPU runtime.
      # pnpm-workspace.yaml also installs both supported native module variants.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.release_tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils xz-utils
      - name: Install desktop build dependencies, including optional native modules
        run: pnpm --filter @openwork/desktop... --filter @openwork/app... --filter openwork-server... install --frozen-lockfile
      - name: Stamp the matching renderer and server version for this build
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: node scripts/release/stamp-version.mjs --version "$RELEASE_VERSION"
      - name: Prepare optional Apple notarization credential
        if: matrix.platform == 'darwin' && needs.validate.outputs.macos_signing == 'developer-id'
        env:
          ZENO_APPLE_NOTARY_P8_BASE64: ${{ secrets.ZENO_APPLE_NOTARY_P8_BASE64 }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync, appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          if (!process.env.ZENO_APPLE_NOTARY_P8_BASE64) throw new Error('Developer ID mode requires the Zeno notarization API key.');
          const path = join(process.env.RUNNER_TEMP, 'zeno-notary.p8');
          writeFileSync(path, Buffer.from(process.env.ZENO_APPLE_NOTARY_P8_BASE64, 'base64'), { mode: 0o600 });
          appendFileSync(process.env.GITHUB_ENV, `APPLE_API_KEY_PATH=${path}\n`);
          JS
      - name: Build and package this Zeno target without automatic publishing
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          ZENO_MAC_CODESIGN_P12_BASE64: ${{ matrix.platform == 'darwin' && secrets.ZENO_MAC_CODESIGN_P12_BASE64 || '' }}
          ZENO_MAC_CODESIGN_PASSWORD: ${{ matrix.platform == 'darwin' && secrets.ZENO_MAC_CODESIGN_PASSWORD || '' }}
          CSC_LINK: ${{ matrix.platform == 'darwin' && needs.validate.outputs.macos_signing == 'developer-id' && secrets.ZENO_MAC_CODESIGN_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'darwin' && needs.validate.outputs.macos_signing == 'developer-id' && secrets.ZENO_MAC_CODESIGN_PASSWORD || '' }}
          MACOS_NOTARIZE: ${{ needs.validate.outputs.macos_signing == 'developer-id' && 'true' || 'false' }}
          APPLE_API_KEY: ${{ secrets.ZENO_APPLE_NOTARY_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.ZENO_APPLE_NOTARY_ISSUER_ID }}
          WIN_CSC_LINK: ${{ matrix.platform == 'win32' && needs.validate.outputs.windows_signing == 'certificate' && secrets.ZENO_WIN_CODESIGN_PFX_BASE64 || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'win32' && needs.validate.outputs.windows_signing == 'certificate' && secrets.ZENO_WIN_CODESIGN_PASSWORD || '' }}
        run: pnpm --filter @openwork/desktop package:electron:zeno --"$TARGET_ARCH"
      - name: Verify packaged identity, runtime dependencies and native-host server startup
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: node apps/desktop/scripts/verify-zeno-bundle.mjs "$RELEASE_PLATFORM" "$RELEASE_ARCH"
      - name: Verify packages and stage complete architecture-specific update feeds
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: node apps/desktop/scripts/collect-zeno-artifacts.mjs "$RELEASE_PLATFORM" "$RELEASE_ARCH"
      - name: Remove the temporary notarization key
        if: always() && matrix.platform == 'darwin'
        run: |
          node --input-type=module <<'JS'
          import { rmSync } from 'node:fs';
          if (process.env.APPLE_API_KEY_PATH) rmSync(process.env.APPLE_API_KEY_PATH, { force: true });
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: zeno-${{ matrix.platform }}-${{ matrix.arch }}
          path: apps/desktop/dist-zeno-staged/${{ matrix.platform }}/${{ matrix.arch }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish verified Zeno assets
    needs: [validate, build]
    if: needs.validate.outputs.publish_release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.release_tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: zeno-*
          path: downloaded
      - name: Verify all six lanes and assemble release metadata
        run: node apps/desktop/scripts/assemble-zeno-release.mjs downloaded dist-zeno-release
      - name: Publish only to this repository's explicit Zeno tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if zeno_release_is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$zeno_release_is_draft" != "true" ]; then
              echo "Refusing to overwrite assets on an already published Zeno release."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist-zeno-release/* --clobber
          else
            gh release create "$RELEASE_TAG" dist-zeno-release/* --draft --verify-tag --latest=false --title "泽诺 Zeno $RELEASE_VERSION" --notes-file dist-zeno-release/RELEASE-NOTES.md
          fi
