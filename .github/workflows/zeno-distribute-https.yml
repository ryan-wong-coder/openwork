# Temporary operator-only HTTPS transport; the server digest gate remains authoritative.
name: Relay verified Zeno assets over HTTPS
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Release Zeno workflow run containing all six lanes
        required: true
        default: "39373868155"
        type: string
      release_tag:
        description: Existing frozen Zeno product tag
        required: true
        default: zeno-v1.1.0-build.3
        type: string
  push:
    branches:
      - personal
    paths:
      - .github/workflows/zeno-distribute-https.yml
permissions:
  actions: read
  contents: read
concurrency:
  group: zeno-distribute-https-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false
jobs:
  register:
    if: github.event_name == 'push' && github.ref == 'refs/heads/personal'
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Registered the operator-only Zeno HTTPS relay."
  relay:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/personal'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Reject malformed source identifiers before checkout
        run: |
          if ! [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] || ! [[ "$RELEASE_TAG" =~ ^zeno-v[0-9]+\.[0-9]+\.[0-9]+(-build\.[1-9][0-9]*)?$ ]]; then
            echo "::error::Expected an existing numeric release run and explicit Zeno tag."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify the frozen product version and successful original run
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          try {
            const version = JSON.parse(readFileSync('apps/desktop/package.json', 'utf8')).version;
            const tag = process.env.RELEASE_TAG;
            const base = `zeno-v${version}`;
            if (!/^\d+\.\d+\.\d+$/.test(version) || !(tag === base || (tag.startsWith(base + '-build.') && /^[1-9]\d*$/.test(tag.slice((base + '-build.').length))))) throw Error();
            const endpoint = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.SOURCE_RUN_ID}`;
            const get = async url => {
              const response = await fetch(url, { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }, signal: AbortSignal.timeout(30000) });
              if (!response.ok) throw Error();
              return response.json();
            };
            const run = await get(endpoint);
            if (String(run.id) !== process.env.SOURCE_RUN_ID || run.name !== 'Release Zeno' || run.path?.split('@')[0] !== '.github/workflows/zeno-release.yml' || run.status !== 'completed' || run.conclusion !== 'success' || run.head_repository?.full_name !== process.env.GITHUB_REPOSITORY) throw Error();
            const expected = new Set(['darwin', 'win32', 'linux'].flatMap(platform => ['x64', 'arm64'].map(arch => `zeno-${platform}-${arch}`)));
            const artifacts = await get(endpoint + '/artifacts?per_page=100');
            if (artifacts.total_count !== 6 || artifacts.artifacts?.length !== 6) throw Error();
            for (const artifact of artifacts.artifacts) {
              if (!expected.delete(artifact.name) || artifact.expired || !Number.isSafeInteger(artifact.size_in_bytes) || artifact.size_in_bytes <= 0) throw Error();
            }
            if (expected.size) throw Error();
            console.log('Verified the frozen version and all six successful native artifacts.');
          } catch {
            console.error('Release source validation failed; no transfer was attempted.');
            process.exitCode = 1;
          }
          JS
      - name: Prepare a private 16 MiB upload probe
        env:
          ZENO_UPLOAD_HTTPS_BASE_URL: ${{ secrets.ZENO_UPLOAD_HTTPS_BASE_URL }}
          ZENO_UPLOAD_HTTPS_USER: ${{ secrets.ZENO_UPLOAD_HTTPS_USER }}
          ZENO_UPLOAD_HTTPS_PASSWORD: ${{ secrets.ZENO_UPLOAD_HTTPS_PASSWORD }}
        run: |-
          umask 077
          node --input-type=module <<'JS'
          import { openSync, ftruncateSync, closeSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const base = process.env.ZENO_UPLOAD_HTTPS_BASE_URL?.trim();
          const user = process.env.ZENO_UPLOAD_HTTPS_USER?.trim();
          const password = process.env.ZENO_UPLOAD_HTTPS_PASSWORD;
          let parsed; try { parsed = new URL(base); } catch { throw Error('Invalid temporary HTTPS relay origin.'); }
          if (parsed.origin !== 'https://www.zeno.ryan-wong.cn' || parsed.username || parsed.password || parsed.search || parsed.hash || !/^\/zeno-upload-[0-9a-f]{32}$/.test(parsed.pathname) || base !== parsed.href || !/^[A-Za-z0-9._-]{1,64}$/.test(user || '') || !password || /[\r\n\0]/.test(password)) throw Error('Invalid temporary HTTPS relay configuration.');
          process.stdout.write('::add-mask::' + base + '\n');
          const quote = value => { if (/[\r\n\0]/.test(value)) throw Error('Unsafe curl configuration value.'); return '"' + value.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"'; };
          const config = (file, name, seconds, retries) => ['url = ' + quote(base + '/' + name), 'upload-file = ' + quote(file), 'user = ' + quote(user + ':' + password), 'request = "PUT"', 'proto = "=https"', 'fail', 'silent', 'show-error', 'connect-timeout = 10', 'max-time = ' + seconds, 'retry = ' + retries, 'retry-delay = 1', 'write-out = "%{http_code} %{size_upload} %{speed_upload} %{time_total}\\n"'].join('\n') + '\n';
          const file = join(process.env.RUNNER_TEMP, 'zeno-https-probe.bin');
          const fd = openSync(file, 'wx', 0o600); try { ftruncateSync(fd, 16 * 1024 * 1024); } finally { closeSync(fd); }
          writeFileSync(join(process.env.RUNNER_TEMP, 'zeno-https-probe.conf'), config(file, 'transport-probe.bin', 20, 0), { flag: 'wx', mode: 0o600 });
          JS
      - name: Require at least 2 MB per second before downloading artifacts
        run: |-
          set -euo pipefail
          umask 077
          if ! curl --disable --config "$RUNNER_TEMP/zeno-https-probe.conf" >"$RUNNER_TEMP/zeno-https-probe.stats" 2>"$RUNNER_TEMP/zeno-https-probe.error"; then
            echo "::error::Private HTTPS speed probe failed; no artifacts were downloaded."
            exit 1
          fi
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const [status, bytes, bytesPerSecond, seconds] = readFileSync(join(process.env.RUNNER_TEMP, 'zeno-https-probe.stats'), 'utf8').trim().split(/\s+/).map(Number);
          if (![status, bytes, bytesPerSecond, seconds].every(Number.isFinite) || status < 200 || status >= 300 || bytes !== 16 * 1024 * 1024 || seconds <= 0) throw Error('Invalid HTTPS speed-probe result.');
          console.log(JSON.stringify({ uploadedBytes: bytes, bytesPerSecond: Math.round(bytesPerSecond), elapsedSeconds: seconds }));
          if (bytesPerSecond < 2000000) throw Error('HTTPS probe was below the 2 MB/s threshold; no artifacts were downloaded.');
          JS
        timeout-minutes: 2
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          pattern: zeno-*
          path: downloaded
          merge-multiple: false
      - name: Reassemble original asset bytes with the frozen release assembler
        timeout-minutes: 5
        run: |
          node apps/desktop/scripts/assemble-zeno-release.mjs downloaded assembled >/dev/null
          node --input-type=module <<'JS'
          import { lstatSync, readFileSync, readdirSync } from 'node:fs';
          import { join } from 'node:path';
          const version = JSON.parse(readFileSync('apps/desktop/package.json', 'utf8')).version;
          const index = JSON.parse(readFileSync('assembled/zeno-release.json', 'utf8'));
          const expected = new Set(['zeno-release.json', 'RELEASE-NOTES.md']);
          const lanes = new Set(['darwin', 'win32', 'linux'].flatMap(platform => ['x64', 'arm64'].map(arch => `${platform}/${arch}`)));
          if (index.version !== version || index.platforms?.length !== 6) throw Error('Assembled version or lane mismatch.');
          for (const lane of index.platforms) {
            if (!lanes.delete(`${lane.platform}/${lane.arch}`)) throw Error('Unexpected native lane.');
            for (const file of lane.files) {
              const name = file.name === lane.manifest ? lane.manifestAsset : file.name;
              if (typeof name !== 'string' || !/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(name) || expected.has(name)) throw Error('Unexpected or duplicate asset name.');
              expected.add(name);
            }
          }
          const actual = readdirSync('assembled');
          if (lanes.size || expected.size !== 24 || actual.length !== 24 || actual.some(name => !expected.has(name) || !lstatSync(join('assembled', name)).isFile())) throw Error('Expected exactly 24 regular release assets.');
          if (actual.filter(name => /\.(dmg|zip|exe|AppImage|deb)$/.test(name)).length !== 10 || actual.filter(name => name.endsWith('.yml')).length !== 6) throw Error('Installer or feed count mismatch.');
          console.log('Verified six lanes, ten installers, six feeds, and 24 complete private assets.');
          JS
      - name: Write private per-file curl configurations
        env:
          ZENO_UPLOAD_HTTPS_BASE_URL: ${{ secrets.ZENO_UPLOAD_HTTPS_BASE_URL }}
          ZENO_UPLOAD_HTTPS_USER: ${{ secrets.ZENO_UPLOAD_HTTPS_USER }}
          ZENO_UPLOAD_HTTPS_PASSWORD: ${{ secrets.ZENO_UPLOAD_HTTPS_PASSWORD }}
        run: |-
          umask 077
          node --input-type=module <<'JS'
          import { writeFileSync, mkdirSync, readdirSync, lstatSync } from 'node:fs';
          import { join, resolve } from 'node:path';
          const base = process.env.ZENO_UPLOAD_HTTPS_BASE_URL?.trim();
          const user = process.env.ZENO_UPLOAD_HTTPS_USER?.trim();
          const password = process.env.ZENO_UPLOAD_HTTPS_PASSWORD;
          let parsed; try { parsed = new URL(base); } catch { throw Error('Invalid temporary HTTPS relay origin.'); }
          if (parsed.origin !== 'https://www.zeno.ryan-wong.cn' || parsed.username || parsed.password || parsed.search || parsed.hash || !/^\/zeno-upload-[0-9a-f]{32}$/.test(parsed.pathname) || base !== parsed.href || !/^[A-Za-z0-9._-]{1,64}$/.test(user || '') || !password || /[\r\n\0]/.test(password)) throw Error('Invalid temporary HTTPS relay configuration.');
          process.stdout.write('::add-mask::' + base + '\n');
          const quote = value => { if (/[\r\n\0]/.test(value)) throw Error('Unsafe curl configuration value.'); return '"' + value.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"'; };
          const config = (file, name, seconds, retries) => ['url = ' + quote(base + '/' + name), 'upload-file = ' + quote(file), 'user = ' + quote(user + ':' + password), 'request = "PUT"', 'proto = "=https"', 'fail', 'silent', 'show-error', 'connect-timeout = 10', 'max-time = ' + seconds, 'retry = ' + retries, 'retry-delay = 1', 'write-out = "%{http_code} %{size_upload} %{speed_upload} %{time_total}\\n"'].join('\n') + '\n';
          const directory = join(process.env.RUNNER_TEMP, 'zeno-https-configs');
          mkdirSync(directory, { mode: 0o700 });
          const names = readdirSync('assembled').sort();
          if (names.length !== 24) throw Error('Expected exactly 24 assembled files.');
          for (const [index, name] of names.entries()) {
            if (!/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(name) || !lstatSync(join('assembled', name)).isFile()) throw Error('Invalid relay file.');
            writeFileSync(join(directory, String(index) + '.conf'), config(resolve('assembled', name), name, 600, 2), { flag: 'wx', mode: 0o600 });
          }
          JS
      - name: Upload the original 24 files with four HTTPS workers
        timeout-minutes: 40
        run: |-
          set -euo pipefail
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/zeno-https-results"
          # Configs contain the endpoint and credentials; neither appears in curl argv.
          # Each worker writes only private fixed-name statistics and diagnostics.
          # shellcheck disable=SC2016
          if ! timeout --kill-after=15s 35m bash -euo pipefail -c '
            find "$RUNNER_TEMP/zeno-https-configs" -maxdepth 1 -type f -name "*.conf" -print0 |
              xargs -0 -r -P 4 -n 1 bash -euo pipefail -c '\''
                config="$1"
                index="$(basename "$config" .conf)"
                curl --disable --config "$config" >"$RUNNER_TEMP/zeno-https-results/$index.stats" 2>"$RUNNER_TEMP/zeno-https-results/$index.error"
              '\'' _
          '; then
            echo "::error::Private HTTPS asset upload failed or timed out."
            exit 1
          fi
          node --input-type=module <<'JS'
          import { readFileSync, readdirSync, statSync } from 'node:fs';
          import { join } from 'node:path';
          const directory = join(process.env.RUNNER_TEMP, 'zeno-https-results');
          const names = readdirSync('assembled').sort();
          const statistics = readdirSync(directory).filter(name => name.endsWith('.stats'));
          if (names.length !== 24 || statistics.length !== 24) throw Error('Incomplete HTTPS upload.');
          let totalBytes = 0;
          for (const [index, name] of names.entries()) {
            const values = readFileSync(join(directory, String(index) + '.stats'), 'utf8').trim().split(/\s+/).map(Number);
            const [status, bytes, bytesPerSecond, seconds] = values;
            if (values.length !== 4 || !values.every(Number.isFinite) || status < 200 || status >= 300 || bytes !== statSync(join('assembled', name)).size || bytesPerSecond < 0 || seconds < 0) throw Error('HTTPS upload response or byte count mismatch.');
            totalBytes += bytes;
          }
          console.log(JSON.stringify({ uploadedFiles: 24, uploadedBytes: totalBytes, publicationPerformed: false }));
          JS
      - name: Remove all private HTTPS configurations and diagnostics
        if: always()
        run: |-
          rm -f -- "$RUNNER_TEMP/zeno-https-probe.bin" "$RUNNER_TEMP/zeno-https-probe.conf" "$RUNNER_TEMP/zeno-https-probe.stats" "$RUNNER_TEMP/zeno-https-probe.error"
          rm -rf -- "$RUNNER_TEMP/zeno-https-configs" "$RUNNER_TEMP/zeno-https-results"
