# Include INSIDE the existing Zeno HTTPS server. Do not replace the vhost.
# This does not change /api/releases/, /downloads/, or /updates/.
location ^~ /api/zeno/v1/ {
    access_log off;
    proxy_pass http://127.0.0.1:8790;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Origin $http_origin;
    client_max_body_size 52m;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}

location = /app { return 302 /app/; }
location = /app/personal.webmanifest {
    access_log off;
    alias /srv/zeno/personal-current/personal.webmanifest;
    types { }
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}
location = /app/index.html {
    # Invitation/reset query strings must not enter ordinary access logs.
    access_log off;
    alias /srv/zeno/personal-current/index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' about:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
}
location = /app/zeno-canvas-shell.html {
    alias /srv/zeno/personal-current/zeno-canvas-shell.html;
    add_header Cache-Control "no-store" always;
    add_header Connection-Allowlist "()" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; frame-src about:; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
}
location ^~ /app/assets/ {
    alias /srv/zeno/personal-current/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
}
location ^~ /app/ {
    access_log off;
    alias /srv/zeno/personal-current/;
    try_files $uri $uri/ /app/index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}
