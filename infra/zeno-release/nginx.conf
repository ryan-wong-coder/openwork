server {
    listen 80;
    listen [::]:80;
    server_name www.zeno.ryan-wong.cn;
    location ^~ /.well-known/acme-challenge/ { root /var/www/zeno-acme; }
    location / { return 301 https://www.zeno.ryan-wong.cn$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.zeno.ryan-wong.cn;
    ssl_certificate /etc/letsencrypt/live/www.zeno.ryan-wong.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.zeno.ryan-wong.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/zeno/current;
    index index.html;
    server_tokens off;
    autoindex off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location /api/releases/ {
        alias /srv/zeno/release-current/api/releases/;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }
    # Checked metadata can outlive a release-current switch. Versioned native
    # download URLs must keep resolving to the immutable historical packages.
    location ~ ^/updates/(?:darwin|win32|linux)/(?:x64|arm64)/(?<zeno_file>zeno-[A-Za-z0-9_-]+-(?<zeno_version>[0-9]+\.[0-9]+\.[0-9]+)\.(?:dmg|zip|exe|AppImage|deb)(?:\.blockmap)?)$ {
        alias /srv/zeno/downloads/$zeno_version/$zeno_file;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /updates/ {
        alias /srv/zeno/release-current/updates/;
        default_type application/octet-stream;
        add_header Cache-Control "no-store" always;
    }
    location /downloads/ {
        alias /srv/zeno/downloads/;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Disposition attachment;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }
    location / { try_files $uri $uri/ =404; }
}
